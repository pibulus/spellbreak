name: Build

# Compiles Spellbreak on a real Mac for every push and pull request: the website
# build and the App Store build (-DAPP_STORE, with the trial and unlock), then
# checks the bundle the way the App Store submission depends on it. Built with
# the Xcode App Store submissions need (26) and the older 16 as a sanity check.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.3", "16.4"]
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Website build (universal bundle, icon, ad-hoc signature)
        run: ./build-app.sh

      # Last, so build/Spellbreak.app is the bundle the App Store would get
      - name: App Store build (trial and unlock compiled in)
        run: SPELLBREAK_APP_STORE=1 ./build-app.sh

      - name: Check the App Store bundle
        run: |
          APP=build/Spellbreak.app
          plutil -lint "$APP/Contents/Info.plist"

          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Spellbreak")
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]

          codesign --verify --strict --verbose=2 "$APP"

          # The icns must carry every rep. A 2x-oversized iconset made iconutil
          # quietly drop four of the ten, twice.
          iconutil -c iconset "$APP/Contents/Resources/AppIcon.icns" -o "$RUNNER_TEMP/AppIcon.iconset"
          ls -la "$RUNNER_TEMP/AppIcon.iconset"
          test "$(ls "$RUNNER_TEMP/AppIcon.iconset" | wc -l | tr -d ' ')" -ge 10

      - name: ScreenBusy heuristic (needs a window server; informational)
        continue-on-error: true
        run: ./scripts/screen-busy-check.sh

  cards:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Store cards render with the system fonts
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow numpy
          "$RUNNER_TEMP/venv/bin/python" scripts/generate-appstore-cards.py
